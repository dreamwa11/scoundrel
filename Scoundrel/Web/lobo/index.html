body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; overflow: hidden; }
.device { background: #e8e6e1; border-radius: 26px; padding: 16px 16px 30px; box-shadow: 0 20px 50px #0008, inset 0 0 0 2px #fff6; position: relative; }

canvas { display: block; image-rendering: pixelated; background: #fff; border-radius: 4px; touch-action: manipulation; cursor: pointer; }
/* On a phone the phone is the device: the panel fills the screen, no frame. */
@media (max-width: 600px), (display-mode: standalone) {
  html, body { background: #fff; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .device { background: none; box-shadow: none; padding: 0; border-radius: 0; }
  .device::after { display: none; }
  canvas { border-radius: 0; }
}

/* ---------------- drawing: the 480x800 panel, 1-bit ---------------- */
const W = 480, H = 800;
const cv = document.getElementById('screen');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const img = {};
const FACES = {
  small: ['G600', 7], body: ['G500', 9], large: ['G500', 11],
  value: ['Gothic', 20], big: ['Gothic', 27], logo: ['Astloch', 22], title: ['Astloch', 34],
};
// fontconvert sizes are points at 150 dpi
const fontOf = f => `${(FACES[f][1] * 150 / 72).toFixed(2)}px ${FACES[f][0]}`;
const capCache = {};
function capH(f) {
  if (capCache[f] == null) { ctx.font = fontOf(f); capCache[f] = ctx.measureText('H').actualBoundingBoxAscent; }
  return capCache[f];
}
function widthOf(text, f) { ctx.font = fontOf(f); return ctx.measureText(text).width; }
// Capitals centred vertically in the box, as toybox::inkCentred does.
function say(x, y, w, h, text, f, align = 'center', white = false) {
  ctx.font = fontOf(f);
  let size = 1;
  const tw = ctx.measureText(text).width;
  if (tw > w && w > 0) { size = w / tw; ctx.font = `${(FACES[f][1] * 150 / 72 * size).toFixed(2)}px ${FACES[f][0]}`; }
  ctx.fillStyle = white ? '#fff' : '#000';
  ctx.textAlign = align === 'center' ? 'center' : align;
  ctx.textBaseline = 'alphabetic';
  const tx = align === 'center' ? x + w / 2 : align === 'right' ? x + w : x;
  ctx.fillText(text, Math.round(tx), Math.round(y + (h + capH(f) * size) / 2));
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

    fill(MARGIN, y, W - 2 * MARGIN, rowH, on ? '#000' : '#fff');
    if (!on) stroke(MARGIN, y, W - 2 * MARGIN, rowH, '#000', 2);
    say(MARGIN + 12, y, 360, rowH, text, 'large', 'left', on);
    hit(MARGIN, y, W - 2 * MARGIN, rowH, fn);
  });
  return top;
}
function drawMenu() {
  title('Lobo');
  say(MARGIN, 104, W - 2 * MARGIN, 26, live() ? `You ${m.youScore}    Wolf ${m.wolfScore}    playing to ${m.target}` : `${store.matches} matches    ${store.won} won`, 'body');
  const rows = [];
  if (live()) rows.push(['Back to the table', () => go(m.phase === 'handover' ? 'handover' : 'table')]);
  rows.push(['New match', () => { if (live()) go('confirm'); else { setupCancelable = true; go('setup'); } }]);
  if (live()) rows.push(['What is left in the deck', () => go('tally')]);
  rows.push(['How to play', () => { howPage = 0; howReturn = 'menu'; go('howto'); }]);
  const bottom = H - MARGIN, creditH = 30;
  say(MARGIN, bottom - creditH + 6, W - 2 * MARGIN, 24, 'Lobo by James Ernest, Crab Fragment Labs, 2022', 'small');
  const listTop = listRows(rows, bottom - creditH - 8);
  const areaTop = 138, room = listTop - areaTop, big = room >= img.wolf_big_ink.height;
  const ink = big ? 'wolf_big_ink' : 'wolf_small_ink', mask = big ? 'wolf_big_mask' : 'wolf_small_mask', ih = img[ink].height;
  if (room >= ih) {
    const y = areaTop + (room - ih) / 2;
    fill(24, y + Math.floor(ih * 79 / 100), W - 48, 2, '#000');
    figure((W - img[ink].width) / 2, y, mask, ink);
  }
}
function drawSetup() {
  title('Sit with the Wolf');
  say(MARGIN, 108, W - 2 * MARGIN, 28, 'Choose how hard the Wolf plays.', 'body');
  const names = ['Hard', 'Medium', 'Easy'], notes = ['All 50 cards', 'The 10s are removed', 'The 9s and 10s are removed'];
  let y = 150;
  for (let i = 0; i < 3; ++i) {
    const on = store.level === i;
    fill(MARGIN, y, W - 2 * MARGIN, 64, on ? '#000' : '#fff', 10); stroke(MARGIN, y, W - 2 * MARGIN, 64, '#000', 2, 10);
    say(MARGIN + 16, y, 160, 64, names[i], 'value', 'left', on);
    say(W - MARGIN - 16 - 260, y, 260, 64, notes[i], 'small', 'right', on);
    hit(MARGIN, y, W - 2 * MARGIN, 64, () => { store.level = i; save(); render(); });
    y += 76;
  }
  y += 10;
  say(MARGIN, y, 140, 56, 'Play to', 'large', 'left');
  const r = W - MARGIN;
  pill(r - 56 - 120 - 56, y, 56, 56, '-', false, () => { if (store.target - 10 >= MIN_T) store.target -= 10; save(); render(); });
  say(r - 56 - 120, y, 120, 56, String(store.target), 'big');
  pill(r - 56, y, 56, 56, '+', false, () => { if (store.target + 10 <= MAX_T) store.target += 10; save(); render(); });
  prose(MARGIN, y + 70, W - 2 * MARGIN, 60, 'The original game is played to 100. Pick a lower number for a shorter match.', 'body', 2);
  const by = H - MARGIN - PILL_H, deal = () => { m = startMatch((Math.random() * 4294967296) >>> 0, store.level, store.target); sel = { p: [], w: [] }; persist(); go('table'); };
  if (setupCancelable) {
    const half = (W - 2 * MARGIN - 12) / 2;
    pill(MARGIN, by, half, PILL_H, 'Back', false, () => go('menu'));
    pill(W - MARGIN - half, by, half, PILL_H, 'Deal the cards', true, deal);
  } else pill(MARGIN, by, W - 2 * MARGIN, PILL_H, 'Deal the cards', true, deal);
}
function drawTally() {
  title('What is left');
  const counts = Array(11).fill(0); m.deck.forEach(c => counts[valueOf(c)]++);
  const top = maxValue(m.level), bw = 80, bh = 104, gap = 10, x0 = MARGIN + (W - 2 * MARGIN - 5 * bw - 4 * gap) / 2;
  for (let v = 1; v <= top; ++v) {
    const i = v - 1, x = x0 + (i % 5) * (bw + gap), y = 130 + Math.floor(i / 5) * (bh + gap);
    if (counts[v]) { fill(x, y, bw, bh, '#fff', R); stroke(x, y, bw, bh, '#000', 2, R); }
    else { fill(x, y, bw, bh, light(), R); stroke(x, y, bw, bh, grey(), 2, R); }
    say(x, y + 10, bw, 56, String(v), 'big');
    say(x, y + bh - 30, bw, 22, counts[v] ? `${counts[v]} LEFT` : 'GONE', 'small');
  }
  const y = 130 + Math.ceil(top / 5) * (bh + gap) + 20;
  say(MARGIN, y, W - 2 * MARGIN, 30, `${m.deck.length} cards in the deck, ${m.played.length} played.`, 'large');
  say(MARGIN, y + 34, W - 2 * MARGIN, 30, `The deck is reshuffled after hand ${reshuffleAfter(m)}.`, 'large');
  prose(MARGIN, y + 80, W - 2 * MARGIN, 60, 'Until then every hand is dealt from what is left, so the cards played are gone.', 'body', 2);
  pill(MARGIN, H - MARGIN - PILL_H, W - 2 * MARGIN, PILL_H, 'Back to the table', true, () => go(live() ? 'table' : 'menu'));
}
function drawConfirm() {
  title('Leave this match?');
  prose(MARGIN, 134, W - 2 * MARGIN, 60, 'The scores of this match will be lost.', 'large', 2);
  const y2 = H - MARGIN - PILL_H, y1 = y2 - 12 - PILL_H;
  pill(MARGIN, y1, W - 2 * MARGIN, PILL_H, 'Start a new match', true, () => { m = null; persist(); setupCancelable = true; go('setup'); });
  pill(MARGIN, y2, W - 2 * MARGIN, PILL_H, 'Keep playing', false, () => go('table'));
}
function endPicture(top, wolfThere) {
  const tableBottom = top + 300;
  wolfScene(top, tableBottom, wolfThere);
  if (!wolfThere) { const h = img.wolf_hat_ink; figure((W - h.width) / 2, tableBottom - 14 - h.height, 'wolf_hat_mask', 'wolf_hat_ink'); }
  fill(0, tableBottom, W, 2, '#000');
}
function endButtons(first, firstFn) {
  const y2 = H - MARGIN - PILL_H, y1 = y2 - 12 - PILL_H;
  pill(MARGIN, y1, W - 2 * MARGIN, PILL_H, first, true, firstFn);
  pill(MARGIN, y2, W - 2 * MARGIN, PILL_H, 'Menu', false, () => go('menu'));
}
function drawHandOver() {
  headline(m.youTookHand ? 'You beat the Wolf' : 'The Wolf scores');
  endPicture(108, !m.youTookHand);
  say(0, 416, W, 60, `+${m.handPoints}`, 'big');
  say(0, 480, W, 32, `You ${m.youScore}    Wolf ${m.wolfScore}`, 'large');
  let t = m.youTookHand ? (m.handPoints ? 'The points left in your hand go to you.' : 'An empty hand of your own: clean, but worth nothing.')
    : (m.handPoints <= 6 ? 'A cheap fold. The Wolf gets little.' : "Every point still in the Wolf's hand is his.");
  t += (RESHUFFLE_EVERY - m.since > 0 && m.deck.length + m.you.length + m.wolf.length >= 9) ? ' The next hand uses the same deck.' : ' The deck will be reshuffled.';
  prose(MARGIN, 516, W - 2 * MARGIN, 60, t, 'body', 2);
  endButtons('Next hand', () => { if (m.phase === 'handover') { deal(m); sel = { p: [], w: [] }; persist(); go('table'); } });
}
function drawMatchOver() {
  const won = youWonMatch(m);
  headline(won ? 'The Wolf retreats' : 'The Wolf wins');
  endPicture(108, !won);
  say(0, 416, W, 60, String(won ? m.youScore : m.wolfScore), 'big');
  say(0, 480, W, 32, `You ${m.youScore}    Wolf ${m.wolfScore}`, 'large');
  say(0, 516, W, 30, `Match to ${m.target} over ${m.hand} hand${m.hand === 1 ? '' : 's'}.`, 'body');
  endButtons('New match', () => { setupCancelable = true; go('setup'); });
}

/* ---------------- how to play ---------------- */
const LESSONS = [
  "Clear every card from the Wolf's hand. The Wolf never acts: every move is yours, and every move has a price.",
  'Perfect: one of your cards takes a Wolf card of the same value. You draw the top card.',
  'Sum: several of your cards that add up exactly to one Wolf card take it. You draw the top card.',
  'Split: one of your cards takes several Wolf cards that add up exactly to it. The Wolf draws the top card.',
  'Over: one of your cards takes one smaller Wolf card. The Wolf draws one card for every point of difference.',
  "Tap your card or cards, then the Wolf's. The bar says what will happen and the button plays it. Cards that cannot join your pick fade.",
  "Empty the Wolf's hand and you score what is left in yours. Fold and the Wolf scores what is left in its hand. First to the target wins.",
  'The top card of the deck is always face up. The deck is reshuffled only every third hand, so remember what has gone. Tap the deck to see what is left.',
];
const caption = (cx, y, t) => say(cx - 220, y, 440, 19, t, 'small');
function exampleRows(ax, ay, aw, wolf, you, note) {
  const cw = 96, ch = 136, gap = 12, n = Math.max(wolf.length, you.length), x0 = ax + (aw - n * cw - (n - 1) * gap) / 2, yy = ay + ch + 34;
  fill(ax, ay - 6, aw, 1, grey());
  say(ax, ay + ch / 2 - 10, 60, 20, 'WOLF', 'small', 'left'); say(ax, yy + ch / 2 - 10, 60, 20, 'YOU', 'small', 'left');
  wolf.forEach((c, i) => card(x0 + i * (cw + gap), ay, cw, ch, c));
  you.forEach((c, i) => card(x0 + i * (cw + gap), yy, cw, ch, c));
  if (wolf.length === 1 && you.length === 1 && valueOf(wolf[0]) === valueOf(you[0]))
    for (let y = ay + ch + 4; y < yy - 3; y += 4) fill(x0 + cw / 2 - 1, y, 3, 2, '#000');
  caption(ax + aw / 2, yy + ch + 16, note);
}
const EXAMPLES = [
  (ax, ay, aw) => {
    const cards = [2, 16, 21, 34, 48], cw = 82, ch = 118, gap = 8, x0 = ax + (aw - 5 * cw - 4 * gap) / 2;
    cards.forEach((c, i) => card(x0 + i * (cw + gap), ay, cw, ch, c));
    caption(ax + aw / 2, ay + ch + 14, '50 CARDS, 1 TO 10 IN FIVE SUITS'); caption(ax + aw / 2, ay + ch + 36, "SUITS DON'T MATTER IN PLAY");
    const y = ay + ch + 76;
    for (let i = 0; i < 4; ++i) back(ax + 40 + i * 30, y, 70, 100);
    for (let i = 0; i < 4; ++i) back(ax + aw - 40 - 70 - i * 30, y, 70, 100);
    caption(ax + 120, y + 112, "THE WOLF'S FOUR"); caption(ax + aw - 120, y + 112, 'YOUR FOUR');
  },
  (ax, ay, aw) => exampleRows(ax, ay, aw, [6], [36], '7 TAKES 7, YOU DRAW'),
  (ax, ay, aw) => exampleRows(ax, ay, aw, [6], [12, 23], '3 + 4 TAKE 7, YOU DRAW'),
  (ax, ay, aw) => exampleRows(ax, ay, aw, [3, 44], [38], '9 TAKES 4 + 5, THE WOLF DRAWS ONE'),
  (ax, ay, aw) => exampleRows(ax, ay, aw, [3], [38], '9 TAKES 4, THE WOLF DRAWS FIVE'),
  (ax, ay, aw) => {
    const x0 = ax + (aw - 3 * CW - 28) / 2;
    [3, 17, 28].forEach((c, i) => card(x0 + i * (CW + 14), ay + (i === 0 ? LIFT : 0), CW, CH, c, { selected: i === 0, faded: i === 2 }));
    [38, 1].forEach((c, i) => card(x0 + i * (CW + 14), ay + CH + 30 - (i === 0 ? LIFT : 0), CW, CH, c, { selected: i === 0, faded: i === 1 }));
    const sy = ay + 2 * CH + 46;
    fill(ax, sy, aw, 48, '#000', 6);
    prose(ax + 8, sy + 4, aw - 16, 40, 'Over: 9 takes 4, the Wolf takes 5 cards.', 'body', 2, true);
    pillPicture(ax + aw - 180, sy + 62, 180, PILL_H, 'Over');
    caption(ax + (aw - 180) / 2, sy + 78, 'THE BUTTON PLAYS IT');
  },
  (ax, ay, aw) => {
    const cw = 84, ch = 120, gap = 10, colW = aw / 2;
    say(ax, ay, colW, 24, 'WOLF CLEARED', 'small');
    [11, 4].forEach((c, i) => card(ax + (colW - 2 * cw - gap) / 2 + i * (cw + gap), ay + 30, cw, ch, c));
    say(ax, ay + 40 + ch, colW, 40, '+7 to you', 'large');
    say(ax + colW, ay, colW, 24, 'YOU FOLD', 'small');
    [27, 48].forEach((c, i) => card(ax + colW + (colW - 2 * cw - gap) / 2 + i * (cw + gap), ay + 30, cw, ch, c));
    say(ax + colW, ay + 40 + ch, colW, 40, '+17 to the Wolf', 'large');
    pillPicture(ax + (aw - 220) / 2, ay + ch + 100, 220, PILL_H, 'Fold', 'icon_lobo_forearm_24');
    caption(ax + aw / 2, ay + ch + 100 + PILL_H + 12, "FOLDING EARLY KEEPS THE WOLF'S SCORE DOWN");
  },
  (ax, ay) => {
    const cw = 96, ch = 136, dx = ax + 40, dy = ay + 10;
    back(dx + 3, dy - 3, cw, ch); card(dx, dy, cw, ch, 36); badge(dx, dy, cw, ch, '31');
    caption(dx + cw / 2, dy + ch + 24, 'THE NEXT CARD');
    const bx = dx + cw + 40;
    [[1, 2], [7, 3], [10, 0]].forEach(([v, n], i) => {
      const x = bx + i * 86, y = ay + 24;
      if (n) { fill(x, y, 76, 96, '#fff', R); stroke(x, y, 76, 96, '#000', 2, R); } else { fill(x, y, 76, 96, light(), R); stroke(x, y, 76, 96, grey(), 2, R); }
      say(x, y + 8, 76, 50, String(v), 'big'); say(x, y + 96 - 28, 76, 22, n ? `${n} LEFT` : 'GONE', 'small');
    });
    caption(bx + 124, ay + 144, 'WHAT IS LEFT');
  },
];
function drawHowTo() {
  title('How to play');
  const last = howPage + 1 >= LESSONS.length, py = H - MARGIN - PILL_H, half = (W - 2 * MARGIN - 12) / 2;
  pill(MARGIN, py, half, PILL_H, 'Back', false, () => { if (howPage > 0) { howPage--; render(); } else go(howReturn); });
  pill(W - MARGIN - half, py, half, PILL_H, last ? 'To the table' : 'Next', true, () => {
    if (!last) { howPage++; render(); } else if (live()) go('table'); else { setupCancelable = true; go('setup'); }
  });
  say(MARGIN, py - 12 - 28, W - 2 * MARGIN, 28, `${howPage + 1} of ${LESSONS.length}`, 'small');
  prose(MARGIN, 104, W - 2 * MARGIN, 130, LESSONS[howPage], 'large', 4);
  EXAMPLES[howPage](MARGIN, 244, W - 2 * MARGIN);
}

/* ---------------- flow ---------------- */
function go(s) { screen = s; render(); }
function render() {
  hits = [];
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  if (screen === 'table' && live()) drawTable();
  else if (screen === 'setup') drawSetup();
  else if (screen === 'tally' && m) drawTally();
  else if (screen === 'handover' && m) drawHandOver();
  else if (screen === 'matchover' && m) drawMatchOver();
  else if (screen === 'howto') drawHowTo();
  else if (screen === 'confirm') drawConfirm();
  else { screen = 'menu'; drawMenu(); }
  const d = ctx.getImageData(0, 0, W, H), p = d.data;
  for (let i = 0; i < p.length; i += 4) {
    const v = (p[i] * 299 + p[i + 1] * 587 + p[i + 2] * 114) / 1000 < 128 ? 0 : 255;
    p[i] = p[i + 1] = p[i + 2] = v; p[i + 3] = 255;
  }
  ctx.putImageData(d, 0, 0);
}

function fit() {
  const bare = matchMedia('(max-width: 600px), (display-mode: standalone)').matches;
  const scale = bare ? Math.min(window.innerWidth / W, (window.innerHeight - 8) / H)
                     : Math.min((window.innerWidth - 40) / W, (window.innerHeight - 60) / H, 1.25);
  cv.style.width = Math.floor(W * scale) + 'px'; cv.style.height = Math.floor(H * scale) + 'px';
  // Shrinking hard pixels makes ragged edges; let the browser smooth them below 1:1.
  cv.style.imageRendering = scale >= 1 ? 'pixelated' : 'auto';
}
cv.addEventListener('click', e => {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  // later registrations sit on top (chips over card bodies)
  for (let i = hits.length - 1; i >= 0; --i) {
    const h = hits[i];
    if (x >= h.x && x < h.x + h.w && y >= h.y && y < h.y + h.h) { h.fn(); return; }
  }
});
window.addEventListener('resize', fit);

Promise.all([
  ...Object.entries(ICONS).map(([k, src]) => new Promise(res => { const i = new Image(); i.onload = () => { img[k] = i; res(); }; i.onerror = res; i.src = src; })),
  ...['Astloch', 'Gothic', 'G500', 'G600'].map(f => document.fonts.load(`20px ${f}`, 'Hand 0123456789')),
]).then(() => {
  fit();
  if (live()) screen = m.phase === 'handover' ? 'handover' : 'table';
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    // The offline copy opens first; when a newer version has just been fetched
    // and takes over, switch to it straight away instead of on the next launch.
    const hadCopy = !!navigator.serviceWorker.controller;
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadCopy || reloaded) return;
      reloaded = true; persist(); location.reload();
    });
    navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {});
  }
  // Ask the browser to keep the offline copy and the saves, not clear them to make room.
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
  render();
});
</script>
