body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; overflow: hidden; }
.device { background: #e8e6e1; border-radius: 26px; padding: 16px 16px 30px; box-shadow: 0 20px 50px #0008, inset 0 0 0 2px #fff6; position: relative; }

canvas { display: block; image-rendering: pixelated; background: #fff; border-radius: 4px; touch-action: manipulation; cursor: pointer; }
/* On a phone the phone is the device: the panel fills the screen, no frame. */
@media (max-width: 600px), (display-mode: standalone) {
  html, body { background: #fff; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .device { background: none; box-shadow: none; padding: 0; border-radius: 0; }
  .device::after { display: none; }
  canvas { border-radius: 0; }
}

/* ---------------- storage (one viewer, best effort) ---------------- */
const KEY = 'crossplay-scoundrel-v1';
let store = { maxHp: 20, played: 0, survived: 0, hasBest: false, best: 0, game: null };
try { const raw = localStorage.getItem(KEY); if (raw) store = Object.assign(store, JSON.parse(raw)); } catch (e) {}
if (!(store.maxHp >= 20 && store.maxHp <= 50)) store.maxHp = 20;
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

/* ---------------- drawing: the 480x800 panel, 1-bit ---------------- */
const W = 480, H = 800;
const cv = document.getElementById('screen');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const img = {};
const FACES = {
  small: ['G600', 7], body: ['G500', 9], large: ['G500', 11],
  value: ['Gothic', 20], big: ['Gothic', 27], logo: ['Astloch', 22], title: ['Astloch', 34],

// fontconvert sizes are points at 150 dpi
const fontOf = f => `${(FACES[f][1] * 150 / 72).toFixed(2)}px ${FACES[f][0]}`;

function widthOf(text, f) { ctx.font = fontOf(f); return ctx.measureText(text).width; }
// Capitals centred vertically in the box, as toybox::inkCentred does.

let hits = [];

// geometry, from ScoundrelScreens.cpp
const TOP = 58, SCENE_BOTTOM = 238, ROOM_TOP = 246, CW = 110, CH = 150, GAP = 8;
const CHIP_TOP = ROOM_TOP + CH + 6, CHIP_H = 40, STRIP_TOP = CHIP_TOP + CHIP_H + 8, STRIP_H = 48;

const roomLeft = (W - (CW * 4 + GAP * 3)) / 2;

const R = 8;

  say(x + w - 8 - 64, y + 4, 64, 34, rank(c), 'value', 'right');

/* ---------------- screens ---------------- */
let screen = 'menu', howPage = 0, result = null;
let g = store.game;

function title(text) {
  say(0, 14, W, 64, text, 'logo');
  fill(24, 88, W - 48, 2, '#000');
}

function drawBoard() {
  // scene, top bar
  const top = TOP + 2;
  icon(`scene_room${(g.roomNo - 1) % 3}`, 0, top);
  fill(0, SCENE_BOTTOM, W, 2, '#000');
  let x = 12;
  const counter = (art, n) => {
    icon(art, x, TOP / 2 - 12);
    const tw = widthOf(String(n), 'large');
    say(x + 28, 0, tw + 4, TOP, String(n), 'large', 'left');
    x += 28 + tw + 14;
  };
  counter('icon_deck_24', g.deck.length + roomCount(g));
  counter('icon_skull_24', monstersLeft(g));
  say(0, 0, W, TOP, `Room ${g.roomNo}`, 'value');
  const mx = W - 12 - 46, my = TOP / 2 - 23;
  fill(mx, my, 46, 46, '#fff', 8); stroke(mx, my, 46, 46, '#000', 2, 8);
  icon('icon_menu_24', mx + 11, my + 11);
  hit(mx, my, 46, 46, () => go('menu'));
  fill(0, TOP, W, 2, '#000');

  // the room
  for (let s = 0; s < ROOM; ++s) {
    const [rx, ry, rw, rh] = slotRect(s);
    const c = g.room[s];
    if (c === NO) { emptySlot(rx, ry, rw, rh); continue; }
    face(rx, ry, rw, rh, c, 64);
    if (g.over) continue;
    hit(rx, ry, rw, rh, () => play(s, 'auto'));
    const cy = CHIP_TOP;
    if (kindOf(c) === MON) {
      const p = preview(g, c), half = (rw - 4) / 2;
      const fistArt = p.fist >= g.hp ? 'icon_skull_24' : 'icon_hand_24';
      if (p.weapon < 0) { chip(rx, cy, half, CHIP_H, String(p.fist), fistArt, false, () => play(s, 'fist')); spentChip(rx + rw - half, cy, half, CHIP_H); }
      else {
        const fistBetter = p.fist <= p.weapon;
        chip(rx, cy, half, CHIP_H, String(p.fist), fistArt, fistBetter, () => play(s, 'fist'));
        chip(rx + rw - half, cy, half, CHIP_H, String(p.weapon), p.weapon >= g.hp ? 'icon_skull_24' : 'icon_sword_24', !fistBetter, () => play(s, 'weapon'));
      }
    } else if (kindOf(c) === WPN) {
      chip(rx, cy, rw, CHIP_H, g.weapon === NO ? 'equip' : 'swap', 'icon_sword_24', false, () => play(s, 'auto'));
    } else {
      if (g.potionUsed) chip(rx, cy, rw, CHIP_H, 'waste', null, false, () => play(s, 'auto'));
      else chip(rx, cy, rw, CHIP_H, '+' + Math.min(g.maxHp - g.hp, val(c)), 'icon_heart_24', false, () => play(s, 'auto'));
    }
  }

  // the strip
  fill(0, STRIP_TOP, W, STRIP_H, '#000');
  const note = noteText(g);
  if (!note) say(0, STRIP_TOP, W, STRIP_H, 'Scoundrel', 'logo', 'center', true);
  else say(10, STRIP_TOP, W - 20, STRIP_H, note, 'body', 'center', true);

  // the desk
  const label = (r, text) => say(r[0] - 20, r[1] + r[3] + 20, r[2] + 40, 19, text, 'small');
  let d = deskRect(0);
  if (!g.deck.length) { emptySlot(...d); say(...d, 'Deck empty', 'small'); }
  else {
    const backs = g.deck.length > 3 ? 3 : g.deck.length - 1;
    for (let i = backs; i >= 0; --i) {
      const cx = d[0] + 2 * i, cy = d[1] - 2 * i;
      fill(cx, cy, d[2], d[3], '#fff', R); stroke(cx, cy, d[2], d[3], '#000', 2, R);
      if (i) continue;
      fill(cx + 7, cy + 7, d[2] - 14, d[3] - 14, grey(), R / 2); stroke(cx + 7, cy + 7, d[2] - 14, d[3] - 14, '#000', 2, R / 2);
      const hx = cx + d[2] / 2 - 26, hy = cy + d[3] / 2 - 34;
      fill(hx, hy, 52, 52, '#fff', 26); stroke(hx, hy, 52, 52, '#000', 2, 26);
      icon('icon_skull_32', hx + 10, hy + 10);
    }
    const px = d[0] + d[2] / 2 - 29, py = d[1] + d[3] - 18;
    fill(px, py, 58, 36, '#fff', 14); stroke(px, py, 58, 36, '#000', 2, 14);
    say(px, py, 58, 36, String(g.deck.length), 'value');
  }
  label(d, 'DECK');

  d = deskRect(1);
  icon('icon_hero_96', d[0] + d[2] / 2 - 48, d[1] - 4);
  const hp = Math.max(0, g.hp), big = String(hp), small = String(g.maxHp);

  const SW = 10, SG = 3;
  const bw = widthOf(big, 'big'), sw = widthOf(small, 'value');
  const nx = d[0] + (d[2] - (bw + SG + SW + SG + sw)) / 2, ny = d[1] + 96;
  say(nx, ny, bw + 4, 44, big, 'big', 'left');
  const sTop = ny + (capH('big') - capH('value')) / 2, ink = capH('value'), base = Math.round(sTop + (44 + ink) / 2);
  const sx = nx + bw + SG;
  ctx.save(); ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.beginPath();
  ctx.moveTo(sx + 1.5, base - 0.5); ctx.lineTo(sx + SW - 1.5, base - ink + 0.5); ctx.stroke(); ctx.restore();
  say(sx + SW + SG, sTop, sw + 4, 44, small, 'value', 'left');
  const bx = d[0] + 6, by = d[1] + d[3] - 6, bwid = d[2] - 12;
  stroke(bx, by, bwid, 8, '#000', 1, 3);
  const filled = Math.floor(bwid * hp / g.maxHp);
  if (filled > 0) fill(bx, by, filled, 8, '#000', 3);
  label(d, 'HEALTH');

  d = deskRect(2);
  if (g.weapon === NO) {
    emptySlot(...d);
    icon('icon_hand_32', d[0] + d[2] / 2 - 16, d[1] + 46);
    say(d[0], d[1] + 86, d[2], 19, 'NO WEAPON', 'small');
    label(d, 'WEAPON');
  } else {
    face(...d, g.weapon, 64);
    const first = Math.max(0, g.slain.length - 4);
    for (let i = first; i < g.slain.length; ++i) {
      const k = i - first, t = d[1] + 40 + k * 10;
      face(d[0] + 6 + k * 4, t, d[2] - 6, d[1] + d[3] + 8 - t, g.slain[i], 48);
    }
    label(d, g.weaponLast >= 0 ? `HITS ≤ ${rank(mk(MON, g.weaponLast))}` : 'WEAPON');
  }

  // buttons
  const bxs = 12, full = W - 24;
  if (g.over) { pill(bxs, BUTTONS_TOP, full, PILL_H, g.won ? 'You survived' : 'You died', true, () => go('result')); return; }
  let fr = [bxs, BUTTONS_TOP, full, PILL_H];
  if (!g.started) {
    const half = (full - 12) / 2;
    pill(bxs, BUTTONS_TOP, half, PILL_H, 'New dungeon', false, () => { newGame(); });
    fr = [bxs + full - half, BUTTONS_TOP, half, PILL_H];
  }
  const fl = g.fledLast ? 'Fled last room' : 'Flee room';
  if (canFlee(g)) pill(...fr, fl, true, () => { flee(g); persist(); render(); }, 'icon_flee_24');
  else {
    stroke(...fr, grey(), 2, 10); say(...fr, fl, 'large');
    hit(...fr, () => { flee(g); persist(); render(); });
  }
}

function drawMenu() {
  title('Scoundrel');
  const rec = store.hasBest ? `${store.played} played    ${store.survived} survived    best ${store.best}` : `${store.played} played    ${store.survived} survived`;
  say(MARGIN, 104, W - MARGIN * 2, 26, rec, 'body');
  const rows = [];
  const live = g && !g.over;
  if (live) rows.push(['Back to the dungeon', '', () => go('board')]);
  rows.push(['New dungeon', '', () => (live && g.started) ? go('confirm') : newGame()]);
  rows.push(['How to play', '', () => { howPage = 0; go('howto'); }]);
  rows.push(['Maximum health', `${store.maxHp} HP`, () => { store.maxHp = store.maxHp + 5 > 50 ? 20 : store.maxHp + 5; save(); render(); }]);
  const rowH = 60, rgap = 6, creditH = 30;
  const listH = rows.length * rowH + (rows.length - 1) * rgap;
  const bottom = H - MARGIN;
  say(MARGIN, bottom - creditH + 6, W - 2 * MARGIN, 24, 'Original game by Zach Gage and Kurt Bieg, 2011', 'small');
  const listTop = bottom - creditH - listH;
  rows.forEach(([text, value, fn], i) => {
    const y = listTop + i * (rowH + rgap), sel = i === 0;
    fill(MARGIN, y, W - 2 * MARGIN, rowH, sel ? '#000' : '#fff');
    if (!sel) stroke(MARGIN, y, W - 2 * MARGIN, rowH, '#000', 2);
    say(MARGIN + 12, y, 300, rowH, text, 'large', 'left', sel);
    if (value) say(W - MARGIN - 212, y, 200, rowH, value, 'large', 'right', sel);
    hit(MARGIN, y, W - 2 * MARGIN, rowH, fn);
  });
  const areaTop = 136, room = listTop - areaTop, w = 136, h = 190;
  if (room >= h + 20) {
    const t = areaTop + (room - h) / 2, cx = W / 2;
    const fan = [mk(WPN, 7), mk(MON, 14, 1), mk(POT, 9)], off = [-136, 0, 136], drop = [14, 0, 14];
    for (const i of [0, 2, 1]) face(cx - w / 2 + off[i], t + drop[i], w, h, fan[i], 96);
  }
}

const LESSONS = [
  'You are a scoundrel delving into a dungeon built from a deck of 44 cards. Clear every card while staying alive.',
  'Each room shows 4 cards. Once you have handled 3, the room refills from the deck. The card you left behind stays where it was.',
  'Monsters hit for their number. Fight bare-handed and take it all, or use your weapon and take only the difference.',
  'Weapons dull: once it has a kill, a weapon only hits monsters equal to or weaker than its last kill.',
  'Potions heal up to your maximum health. Only one per room counts; a second is wasted.',
  'Before you touch a full room you may flee with this button: its cards go to the bottom of the deck. Never two rooms in a row.',
];
function wrap(text, f, width) {
  ctx.font = fontOf(f);
  const out = []; let line = '';
  for (const word of text.split(' ')) {
    const t = line ? line + ' ' + word : word;
    if (ctx.measureText(t).width > width && line) { out.push(line); line = word; } else line = t;
  }
  if (line) out.push(line);
  return out;
}
let lightPat = null;
function light() {
  if (!lightPat) {
    const p = document.createElement('canvas'); p.width = p.height = 2;
    const pc = p.getContext('2d'); pc.fillStyle = '#fff'; pc.fillRect(0, 0, 2, 2); pc.fillStyle = '#000'; pc.fillRect(0, 0, 1, 1);
    lightPat = ctx.createPattern(p, 'repeat');
  }
  return lightPat;
}
// The examples are pictures: nothing on them is registered as a button.
function chipArt(x, y, w, h, label, art, loud) {
  fill(x, y, w, h, loud ? '#000' : '#fff', 8); stroke(x, y, w, h, '#000', 2, 8);
  const tw = widthOf(label, 'body'), ix = x + (w - 28 - tw) / 2;
  icon(art, ix, y + (h - 24) / 2, loud);
  say(ix + 28, y, tw + 6, h, label, 'body', 'left', loud);
}
function monsterWithChoices(x, y, w, h, c, fist, weapon) {
  face(x, y, w, h, c, 64);
  const half = (w - 4) / 2, cy = y + h + 6, fistBetter = weapon < 0 || fist <= weapon;
  chipArt(x, cy, half, CHIP_H, String(fist), 'icon_hand_24', weapon >= 0 && fistBetter);
  if (weapon < 0) spentChip(x + w - half, cy, half, CHIP_H);
  else chipArt(x + w - half, cy, half, CHIP_H, String(weapon), 'icon_sword_24', !fistBetter);
}
const caption = (cx, y, t) => say(cx - 120, y, 240, 19, t, 'small');
const EXAMPLES = [
  (ax, ay, aw) => {
    const cards = [mk(MON, 4), mk(WPN, 7), mk(POT, 8)], labels = ['MONSTER', 'WEAPON', 'POTION'];
    const w = 132, h = 184, gap = 14; let x = ax + (aw - 3 * w - 2 * gap) / 2;
    for (let i = 0; i < 3; ++i) { face(x, ay, w, h, cards[i], 96); caption(x + w / 2, ay + h + 10, labels[i]); x += w + gap; }
  },
  (ax, ay, aw) => {
    const w = 104, h = 132, gap = 8, left = ax + (aw - 4 * w - 3 * gap) / 2;
    const fresh = [mk(MON, 3), mk(POT, 5), mk(WPN, 3), mk(MON, 9, 1)];
    for (let row = 0; row < 2; ++row) {
      const y = ay + row * (h + 44);
      for (let s = 0; s < 4; ++s) {
        const x = left + s * (w + gap);
        if (row === 0 && s !== 2) emptySlot(x, y, w, h); else face(x, y, w, h, fresh[s], 48);
      }
      caption(ax + aw / 2, y + h + 8, row === 0 ? '3 HANDLED, ONE LEFT BEHIND' : '3 NEW CARDS, THE OLD ONE STAYS');
    }
  },
  (ax, ay, aw) => {
    const w = 120, h = 164, gap = 56, x = ax + (aw - 2 * w - gap) / 2;
    face(x, ay, w, h, mk(WPN, 5), 64); caption(x + w / 2, ay + h + 14, 'YOUR WEAPON');
    const mx = x + w + gap;
    monsterWithChoices(mx, ay, w, h, mk(MON, 8), 8, 3);
    caption(mx + w / 2, ay + h + CHIP_H + 14, 'HANDS 8, WEAPON 3');
  },
  (ax, ay, aw) => {
    const w = 112, h = 156, gap = 20; let x = ax + (aw - 3 * w - 2 * gap) / 2;
    face(x, ay, w, h, mk(WPN, 9), 64); face(x + 6, ay + 40, w - 6, h - 32, mk(MON, 7), 48);
    const capY = ay + h + CHIP_H + 14;
    caption(x + w / 2, capY, 'HITS ≤ 7'); x += w + gap;
    monsterWithChoices(x, ay, w, h, mk(MON, 6), 6, 0); caption(x + w / 2, capY, '6: IT CAN HIT'); x += w + gap;
    monsterWithChoices(x, ay, w, h, mk(MON, 11, 1), 11, -1); caption(x + w / 2, capY, 'J: HANDS ONLY');
  },
  (ax, ay, aw, ah) => {
    const gap = 10, h = Math.min(128, (ah - 2 * gap) / 3), w = 128, left = ax + (aw - 3 * w - 2 * gap) / 2;
    for (let i = 0; i < 9; ++i) face(left + (i % 3) * (w + gap), ay + Math.floor(i / 3) * (h + gap), w, h, mk(POT, i + 2), 48);
  },
  (ax, ay, aw) => {
    const w = 300, bx = ax + (aw - w) / 2, by = ay + 30;
    fill(bx, by, w, PILL_H, light(), 10); stroke(bx, by, w, PILL_H, grey(), 2, 10);
    const tw = widthOf('Flee room', 'large'), ix = bx + (w - 32 - tw) / 2;
    icon('icon_flee_24', ix, by + (PILL_H - 24) / 2);
    say(ix + 32, by, tw + 4, PILL_H, 'Flee room', 'large', 'left');
    caption(bx + w / 2, by + PILL_H + 12, 'AT THE FOOT OF THE TABLE');
  },
];
function drawHowTo() {
  title('How to play');
  const last = howPage + 1 >= LESSONS.length;
  const py = H - MARGIN - PILL_H, half = (W - 2 * MARGIN - 12) / 2;
  pill(MARGIN, py, half, PILL_H, 'Back', false, () => { if (howPage > 0) { howPage--; render(); } else go('menu'); });
  pill(W - MARGIN - half, py, half, PILL_H, last ? 'Into the dungeon' : 'Next', true, () => {
    if (!last) { howPage++; render(); } else if (g && !g.over) go('board'); else newGame();
  });
  say(MARGIN, py - 12 - 28, W - 2 * MARGIN, 28, `${howPage + 1} of ${LESSONS.length}`, 'small');
  const top = 104;
  wrap(LESSONS[howPage], 'large', W - 2 * MARGIN).slice(0, 4).forEach((l, i) => say(MARGIN, top + 6 + i * 29, W - 2 * MARGIN, 29, l, 'large'));
  const ay = top + 140, ah = py - 12 - 28 - 4 - ay;
  EXAMPLES[howPage](MARGIN, ay, W - 2 * MARGIN, ah);
}
function drawConfirm() {
  title('Abandon this dungeon?');
  say(MARGIN, 134, W - 2 * MARGIN, 30, 'Your current run will be lost.', 'large');
  const y2 = H - MARGIN - PILL_H, y1 = y2 - 12 - PILL_H;
  pill(MARGIN, y1, W - 2 * MARGIN, PILL_H, 'Find another dungeon', true, () => newGame());
  pill(MARGIN, y2, W - 2 * MARGIN, PILL_H, 'Keep playing', false, () => go('board'));
}
// The death screen: the whole panel, as on the device.
const DIED_FACE = [164, 86, 152];
function drawDeath() {
  say(0, 14, W, 92, 'You died', 'title');
  const top = 108;
  icon('scene_died', 0, top);
  const [fx, fy0, fw] = DIED_FACE, fy = top + fy0;
  say(fx, fy + 4, fw, 20, 'HERE LIES', 'small');
  say(fx, fy + 24, fw, 20, 'A SCOUNDREL', 'small');
  fill(fx + fw / 2 - 30, fy + 52, 60, 2, '#000');
  say(fx, fy + 60, fw, 48, `Room ${g.roomNo}`, 'value');
  say(fx, fy + 116, fw, 20, 'SCORE', 'small');
  say(fx, fy + 136, fw, 60, String(g.score), 'big');
  const rows = top + 380 + 10, left = monstersLeft(g);
  say(0, rows, W, 34, left === 1 ? '1 monster still in the dungeon.' : `${left} monsters still in the dungeon.`, 'large');
  say(0, rows + 34, W, 34, result && result.newBest ? 'A new best score!' : `Best score: ${store.best}`, 'large');
  const y2 = H - MARGIN - PILL_H, y1 = y2 - 12 - PILL_H;
  pill(MARGIN, y1, W - 2 * MARGIN, PILL_H, 'Start another dungeon', true, () => newGame());
  pill(MARGIN, y2, W - 2 * MARGIN, PILL_H, 'Menu', false, () => go('menu'));
}
// The survivor's screen, built like the death screen.
function drawSurvived() {
  say(0, 14, W, 92, 'You survived!', 'title');
  const top = 108;
  icon('scene_survived', 0, top);
  const t = top + 380 + 6, num = String(g.score);
  const lw = widthOf('SCORE', 'small'), nw = widthOf(num, 'big'), x = (W - lw - 12 - nw) / 2;
  say(x, t, lw + 4, 60, 'SCORE', 'small', 'left');
  say(x + lw + 12, t, nw + 4, 60, num, 'big', 'left');
  say(0, t + 60, W, 32, `Cleared in ${g.roomNo} rooms, ${g.hp} health left.`, 'large');
  say(0, t + 92, W, 32, result && result.newBest ? 'A new best score!' : `Best score: ${store.best}`, 'large');
  const y2 = H - MARGIN - PILL_H, y1 = y2 - 12 - PILL_H;
  pill(MARGIN, y1, W - 2 * MARGIN, PILL_H, 'Start another dungeon', true, () => newGame());
  pill(MARGIN, y2, W - 2 * MARGIN, PILL_H, 'Menu', false, () => go('menu'));
}
function drawResult() {
  if (g.won) drawSurvived(); else drawDeath();
}

/* ---------------- flow ---------------- */
function persist() { store.game = g; save(); }
function newGame() {
  g = start((Math.random() * 4294967296) >>> 0, store.maxHp);
  persist(); go('board');
}
function play(slot, mode) {
  if (!resolve(g, slot, mode)) return;
  if (g.over) {
    store.played++; if (g.won) store.survived++;
    const newBest = !store.hasBest || g.score > store.best;
    if (newBest) { store.hasBest = true; store.best = g.score; }
    result = { newBest };
    // The end of a run goes straight to its own screen.
    persist(); go('result'); return;
  }
  persist(); render();
}
function go(s) { screen = s; render(); }

function render() {
  hits = [];
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  if (screen === 'board' && g) drawBoard();
  else if (screen === 'howto') drawHowTo();
  else if (screen === 'confirm') drawConfirm();
  else if (screen === 'result' && g) drawResult();
  else { screen = 'menu'; drawMenu(); }
  // Everything the panel shows is black or white.
  const d = ctx.getImageData(0, 0, W, H), p = d.data;
  for (let i = 0; i < p.length; i += 4) {
    const v = (p[i] * 299 + p[i + 1] * 587 + p[i + 2] * 114) / 1000 < 128 ? 0 : 255;
    p[i] = p[i + 1] = p[i + 2] = v; p[i + 3] = 255;
  }
  ctx.putImageData(d, 0, 0);
}

function fit() {
  const bare = matchMedia('(max-width: 600px), (display-mode: standalone)').matches;
  const scale = bare ? Math.min(window.innerWidth / W, (window.innerHeight - 8) / H)
                     : Math.min((window.innerWidth - 40) / W, (window.innerHeight - 60) / H, 1.25);
  cv.style.width = Math.floor(W * scale) + 'px'; cv.style.height = Math.floor(H * scale) + 'px';
  // Shrinking hard pixels makes ragged edges; let the browser smooth them below 1:1.
  cv.style.imageRendering = scale >= 1 ? 'pixelated' : 'auto';
}
cv.addEventListener('click', e => {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  // later registrations sit on top (chips over card bodies)
  for (let i = hits.length - 1; i >= 0; --i) {
    const h = hits[i];
    if (x >= h.x && x < h.x + h.w && y >= h.y && y < h.y + h.h) { h.fn(); return; }
  }
});
window.addEventListener('resize', fit);

Promise.all([
  ...Object.entries(ICONS).map(([k, src]) => new Promise(res => { const i = new Image(); i.onload = () => { img[k] = i; res(); }; i.onerror = res; i.src = src; })),
  ...['Astloch', 'Gothic', 'G500', 'G600'].map(f => document.fonts.load(`20px ${f}`, 'Room 0123456789 ≤–')),
]).then(() => {
  fit();
  if (g && !g.over) screen = 'board';
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    // The offline copy opens first; when a newer version has just been fetched
    // and takes over, switch to it straight away instead of on the next launch.
    const hadCopy = !!navigator.serviceWorker.controller;
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadCopy || reloaded) return;
      reloaded = true; persist(); location.reload();
    });
    navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {});
  }
  // Ask the browser to keep the offline copy and the saves, not clear them to make room.
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
  render();
});
</script>
